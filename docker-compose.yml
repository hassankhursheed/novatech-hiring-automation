# NovaTech Hiring Automation - local / single-tenant stack
#
#   docker compose up -d --build        start everything
#   docker compose ps                   status
#   docker compose logs -f backend n8n  follow logs
#
# Exposed on localhost only:  n8n  http://localhost:5678   |  API  http://localhost:8000/docs
#                             Langfuse (optional: --profile observability)  http://localhost:3000
#                             business DB  localhost:${BUSINESS_DB_PORT:-5433}
name: novatech

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ------------------------------------------------------------------------------------------
  # Business database (source of truth). Separate from n8n's own database on purpose.
  # ------------------------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: novatech
      TZ: UTC
      NOVATECH_OWNER_PASSWORD: ${NOVATECH_OWNER_PASSWORD:?set NOVATECH_OWNER_PASSWORD in .env}
      NOVATECH_N8N_DB_PASSWORD: ${NOVATECH_N8N_DB_PASSWORD:?set NOVATECH_N8N_DB_PASSWORD in .env}
      NOVATECH_BACKEND_DB_PASSWORD: ${NOVATECH_BACKEND_DB_PASSWORD:?set NOVATECH_BACKEND_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${BUSINESS_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novatech"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app]

  # Applies SQL migrations (db/migrations) with dbmate, then exits.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    <<: *logging
    environment:
      DATABASE_URL: postgres://novatech_owner:${NOVATECH_OWNER_PASSWORD}@db:5432/novatech?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    command: ["--wait", "up"]
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [app]
    restart: "no"

  # Loads configuration seeds (idempotent), then exits.
  seed:
    image: postgres:17-alpine
    <<: *logging
    entrypoint: ["/bin/sh", "/usr/local/bin/run-seeds.sh"]
    environment:
      DATABASE_URL: postgres://novatech_owner:${NOVATECH_OWNER_PASSWORD}@db:5432/novatech?sslmode=disable
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_FAST_TIMERS: ${DEMO_FAST_TIMERS:-false}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-}
      APP_ENV: ${APP_ENV:-development}
      FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-false}
    volumes:
      - ./db/seed:/seed:ro
      - ./config:/config:ro
      - ./infra/seed/run-seeds.sh:/usr/local/bin/run-seeds.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app]
    restart: "no"

  # ------------------------------------------------------------------------------------------
  # Backend API (FastAPI): validation, scoring, AI analysis, documents
  # ------------------------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    image: novatech/backend:${APP_VERSION:-0.1.0}
    <<: [*restart, *logging]
    # Only what the backend needs - never the whole .env (least privilege).
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Karachi}
      DATABASE_URL: postgresql://backend_app:${NOVATECH_BACKEND_DB_PASSWORD}@db:5432/novatech
      STORAGE_DIR: /data/storage
      INTERNAL_API_KEYS: ${INTERNAL_API_KEYS:?set INTERNAL_API_KEYS in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      DEFAULT_PHONE_REGION: ${DEFAULT_PHONE_REGION:-PK}
      FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-false}
      LINK_SIGNING_SECRET: ${LINK_SIGNING_SECRET:?set LINK_SIGNING_SECRET in .env}
      LINK_MAX_TTL_DAYS: ${LINK_MAX_TTL_DAYS:-30}
      STAFF_DEMO_PASSWORD: ${STAFF_DEMO_PASSWORD:-}
      # Dispatcher kick + error replay webhooks (internal network; authenticated with the internal API key)
      N8N_BASE_URL: http://n8n:5678
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      LLM_MODEL: ${LLM_MODEL:-ministral-14b-latest}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_REQUESTS_PER_SECOND: ${LLM_REQUESTS_PER_SECOND:-0.25}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - storage_data:/data/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app]

  # ------------------------------------------------------------------------------------------
  # Portal (React + TypeScript): careers form, candidate and staff link pages, HR portal
  # ------------------------------------------------------------------------------------------
  portal:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PORTAL_API_URL:-http://localhost:8000}
        VITE_INTAKE_URL: ${PORTAL_INTAKE_URL:-http://localhost:5678/webhook/applications}
        VITE_DEV_MAILBOX_URL: ${PORTAL_DEV_MAILBOX_URL-http://localhost:8025}  # set empty for production
    image: novatech/portal:${APP_VERSION:-0.1.0}
    <<: [*restart, *logging]
    environment:
      PORTAL_CONNECT_SRC: ${PORTAL_CONNECT_SRC:-http://localhost:8000 http://localhost:5678}
    ports:
      - "127.0.0.1:${PORTAL_PORT:-5173}:8080"
    networks: [app]

  # Test runner (profile "test"): unit + API + database integration tests against the running DB.
  #   docker compose --profile test run --rm backend-tests
  # Integration tests run inside rolled-back transactions and leave no data behind.
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      # Integration tests start a throwaway PostgreSQL per run (testcontainers) through the host's Docker engine,
      # and reach it on the host's published port.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      REQUIRE_DB_TESTS: "1"
      NOVATECH_DB_DIR: /db
      # Scenario runner (python -m tests.scenarios.run) and journey check (python -m tests.scenarios.journey) drive
      # the running stack. They create applications on the reserved test domain example.com.
      SCENARIO_API_KEY: ${INTERNAL_API_KEYS}  # first key is used; unit tests keep their own fake keys
      SCENARIO_DATABASE_URL: postgresql://novatech_owner:${NOVATECH_OWNER_PASSWORD}@db:5432/novatech
      SCENARIO_REPORT_DIR: /app/reports
      # AI evaluation (tests/ai_eval) with the live model; skipped while the key is empty
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-ministral-14b-latest}
      LLM_REQUESTS_PER_SECOND: ${LLM_REQUESTS_PER_SECOND:-0.25}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      # The working tree is mounted, so the tests always run against the current code without a rebuild.
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./reports:/app/reports
      - ./db:/db:ro
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app]
    restart: "no"

  # ------------------------------------------------------------------------------------------
  # n8n (orchestration) + its own database + external task runner (n8n 2.x recommended setup)
  # ------------------------------------------------------------------------------------------
  n8n-db:
    image: postgres:17-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [n8n]

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.41.7}
    <<: [*restart, *logging]
    environment:
      # Database (n8n's own state: workflows, credentials, executions)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Encrypts stored credentials. Back it up: without it, saved credentials cannot be decrypted.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # URLs and time
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Karachi}
      TZ: ${COMPANY_TIMEZONE:-Asia/Karachi}
      # Security (set N8N_SECURE_COOKIE=true when served over HTTPS)
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"              # no unverified community nodes
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"  # 256 MiB zip-bomb guard
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      # Task runners in external mode (separate container, recommended for production)
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set N8N_RUNNERS_AUTH_TOKEN in .env}
      N8N_RUNNERS_TASK_TIMEOUT: "60"   # Code nodes must stay small; heavy logic belongs in the backend
      # Execution data retention (keep 14 days of history for troubleshooting and evidence)
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      n8n-db:
        condition: service_healthy
    networks: [n8n, app]

  n8n-runners:
    image: n8nio/runners:${N8N_VERSION:-2.41.7}
    <<: [*restart, *logging]
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    depends_on:
      - n8n
    networks: [n8n]

  # ------------------------------------------------------------------------------------------
  # Mailpit: development mail catcher. n8n sends via SMTP mailpit:1025; view mail at localhost:8025.
  # Fictional candidates never receive real email. Replace with a real SMTP/transactional provider
  # (company domain with SPF/DKIM) in production.
  # ------------------------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.3
    <<: [*restart, *logging]
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db        # keep demo mail across restarts
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:8025:8025"
    networks: [app]

  # ------------------------------------------------------------------------------------------
  # Langfuse (optional, profile "observability"): a trace of every AI call (prompt, output, tokens, latency,
  # grouped by correlation id) plus evaluation datasets and experiment runs. Self-hosted Langfuse v4:
  #   docker compose --profile observability up -d       ->  http://localhost:3000
  # Sign in with LANGFUSE_INIT_USER_EMAIL / LANGFUSE_INIT_USER_PASSWORD from .env. The project and its API keys
  # (LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY, the same ones the backend uses) are created on first start.
  # To use Langfuse Cloud instead, put its keys in .env and set LANGFUSE_HOST=https://cloud.langfuse.com.
  # ------------------------------------------------------------------------------------------
  langfuse-db:
    profiles: ["observability"]
    image: postgres:17-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-}
      POSTGRES_DB: langfuse
      TZ: UTC
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [observability]

  langfuse-clickhouse:
    profiles: ["observability"]
    image: clickhouse/clickhouse-server:25.12
    <<: [*restart, *logging]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [observability]

  langfuse-minio:
    profiles: ["observability"]
    image: cgr.dev/chainguard/minio
    <<: [*restart, *logging]
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [observability]

  langfuse-redis:
    profiles: ["observability"]
    image: redis:7
    <<: [*restart, *logging]
    command: ["--requirepass", "${LANGFUSE_REDIS_PASSWORD:-}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [observability]

  langfuse-worker:
    profiles: ["observability"]
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    <<: [*restart, *logging]
    depends_on: &langfuse-deps
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-}@langfuse-db:5432/langfuse
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-}
    networks: [observability]

  langfuse-web:
    profiles: ["observability"]
    image: docker.langfuse.com/langfuse/langfuse:4
    <<: [*restart, *logging]
    depends_on: *langfuse-deps
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_INIT_ORG_ID: novatech
      LANGFUSE_INIT_ORG_NAME: NovaTech Solutions
      LANGFUSE_INIT_PROJECT_ID: novatech-hiring
      LANGFUSE_INIT_PROJECT_NAME: NovaTech Hiring AI
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: NovaTech Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    networks: [observability, app]

networks:
  app:
  n8n:
  observability:

volumes:
  db_data:
  n8n_db_data:
  n8n_data:
  storage_data:
  mailpit_data:
  langfuse_db_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
