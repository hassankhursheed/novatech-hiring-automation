name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, white-box tests, testcontainers, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Tests (unit, API, and database integration on a throwaway PostgreSQL via testcontainers)
        env:
          APP_ENV: test
          REQUIRE_DB_TESTS: "1"
        run: uv run pytest --cov=app --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/coverage.xml
            backend/junit.xml

  portal:
    name: Portal - type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  workflows:
    name: n8n workflows - build and expression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node n8n/src/build.mjs
