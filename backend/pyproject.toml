[project]
name = "novatech-hiring-backend"
version = "0.1.0"
description = "NovaTech hiring automation backend: validation, scoring, advisory AI analysis and documents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "phonenumbers>=8.13",
  "psycopg[binary,pool]>=3.2",
  "structlog>=24.4",
  "python-multipart>=0.0.18",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.1",
  "langchain-openai>=1.0",
  "langfuse>=3.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
mistral = ["langchain-mistralai>=1.0"]
google = ["langchain-google-genai>=3.0"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "reportlab>=4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["db: integration tests that need a running PostgreSQL (DATABASE_URL_TEST)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
