[project]
name = "novatech-hiring-backend"
version = "0.1.0"
description = "NovaTech hiring automation backend: validation, scoring, advisory AI analysis and documents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "phonenumbers>=8.13",
  "psycopg[binary,pool]>=3.2",
  "structlog>=24.4",
  "python-multipart>=0.0.18",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-mistralai>=1.0",
  "langfuse>=3.0",
  "tzdata>=2024.1",
  "pyjwt>=2.10",
  "httpx>=0.28",
  "reportlab>=4.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "testcontainers[postgres]>=4.9",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]
# AI evaluation (DeepEval assertions, Langfuse datasets/experiments): uv sync --group eval
eval = [
  "deepeval>=3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not ai_eval'"
markers = [
  "db: integration tests against a real PostgreSQL (a throwaway testcontainers database, or DATABASE_URL_TEST)",
  "ai_eval: AI quality assertions against the live model (needs MISTRAL_API_KEY; run with tests/ai_eval)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
